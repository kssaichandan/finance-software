<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:," />
</head>
<body>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand" onclick="navigate('dashboard')" title="Go to Dashboard">
        <span class="brand-icon">₹</span>
        <span class="brand-name">Finance<br>Tracker</span>
      </div>
      <div class="sidebar-cta">
        <button class="cta-pay" onclick="openRecordPayment()" title="Record money received from a borrower">
          <span class="cta-icon">₹</span><span class="cta-text">Record Payment</span>
        </button>
      </div>
      <div class="sidebar-search">
        <input id="global-search" type="text" placeholder="🔍 Find borrower…" autocomplete="off"
          title="Type a name, phone, vehicle no or book no — results appear as you type"
          oninput="globalSearchInput(this.value)"
          onfocus="globalSearchInput(this.value)"
          onkeydown="globalSearchKey(event)" />
        <div id="global-results" class="gs-results hidden"></div>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')" title="Today's work and business overview">
          <span class="nav-icon">🏠</span>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-view="borrowers" onclick="navigate('borrowers')" title="All borrowers, search and filters">
          <span class="nav-icon">👥</span>
          <span>Borrowers</span>
        </a>
        <a class="nav-item" data-view="add" onclick="navigate('add')" title="Give a new loan">
          <span class="nav-icon">➕</span>
          <span>New Loan</span>
        </a>
        <a class="nav-item" data-view="collections" onclick="navigate('collections')" title="Day book — every payment received, by date">
          <span class="nav-icon">🧾</span>
          <span>Collections</span>
        </a>
        <a class="nav-item" data-view="portfolio" onclick="navigate('portfolio')" title="Full lending-book summary">
          <span class="nav-icon">📈</span>
          <span>Portfolio</span>
        </a>
        <div class="nav-sep"></div>
        <a class="nav-item" data-view="settings" onclick="navigate('settings')" title="Business name, text size, backup, password">
          <span class="nav-icon">⚙️</span>
          <span>Settings</span>
        </a>
        <a class="nav-item" data-view="help" onclick="navigate('help')" title="How to use this app">
          <span class="nav-icon">❓</span>
          <span>Help</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-date" id="sidebar-date"></div>
        <button class="sidebar-refresh" onclick="refreshCurrentView()" title="Reload this screen (F5)">⟳ Refresh</button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content">
      <div id="view" class="view-container"></div>
    </main>

  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="handleOverlayClick(event)">
    <div id="modal-box" class="modal-box" onclick="event.stopPropagation()">
      <div id="modal-inner"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toasts"></div>

  <!-- Loading spinner -->
  <div id="loader" class="loader hidden">
    <div class="spinner"></div>
  </div>

  <script src="help.js"></script>
  <script src="app.js"></script>
</body>
</html>
